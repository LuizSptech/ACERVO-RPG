<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Acervo RPG</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" href="./assets/imagens/rpg.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
 
<body class="dashboard">
 
    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="logo">ACERVORPG</div>
        <div class="usuario">
            <div id="nomeUsuario"></div>
        </div>
        <div class="menu">
            <button>Dashboard</button>
            <button onclick="window.location='Esteriotipos.html'">Esteriotipos</button>
            <button onclick="window.location='sorte.html'">Testar Sorte</button>
            <button onclick="window.location='index.html'">Home</button>
            <button onclick="sair()">Sair</button>
        </div>
    </div>
 
    <!-- MAIN -->
    <div class="main">
 
        <div class="topo">
            <div>
                <h1>Dashboard RPG</h1>
                <p>Seu perfil de jogador</p>
            </div>
        </div>
 
        <!-- CARDS -->
        <div class="cards">
            <div class="card">
                <h2>Perfil Principal</h2>
                <p id="perfilPrincipal"></p>
            </div>
            <div class="card">
                <h2>Quiz Respondidos</h2>
                <p id="quizRespondidos">1</p>
            </div>
        </div>
 
        <!-- GRÁFICO -->
        <div class="grafico-area">
            <canvas id="graficoRadar"></canvas>
        </div>
 
    </div>
 
</body>
</html>
 
<script>
    let usuario = sessionStorage.ID_USUARIO;
    nomeUsuario.innerHTML = sessionStorage.NOME_USUARIO;
 
    fetch(`/quizz/dashboard/${usuario}`)
    .then(function (resposta) {
        return resposta.json();
    })
    .then(function (dados) {
        let resultados = [];
        let valores = [];
        let soma = 0;
        let maior = 0;
        let perfil = "";
 
        for (let i = 0; i < dados.length; i++) {
            resultados.push(dados[i].nome);
            let pontos = Number(dados[i].pontuacao);
            valores.push(pontos);
            soma += pontos;
            if (pontos > maior) {
                maior = pontos;
                perfil = dados[i].nome;
            }
        }
 
        quizRespondidos.innerHTML = dados[0].quantidadeQuiz;
        perfilPrincipal.innerHTML = perfil;
 
        new Chart(document.getElementById("graficoRadar"), {
            type: 'radar',
            data: {
                labels: resultados,
                datasets: [{
                    label: 'Espectro',
                    data: valores,
                    fill: true,
                    borderWidth: 3,
                    pointRadius: 5,
                    borderColor: "black",
                    backgroundColor: "rgba(0,0,0,0.2)",
                    pointBackgroundColor: "#754600",
                    pointBorderColor: "black"
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    r: {
                        suggestedMin: 0,
                        suggestedMax: 10,
                        ticks: { color: "black" },
                        grid: { color: "black" },
                        angleLines: { color: "black" },
                        pointLabels: { color: "black", font: { size: 14 } }
                    }
                }
            }
        });
    });
 
    function sair() {
        sessionStorage.clear();
        window.location = "./login.html";
    }
</script>
