<script>


    function entrar() {
    aguardar();

    var emailVar = email_input.value;
    var senhaVar = senha_input.value;

    
    if (emailVar == "" || senhaVar == "") {
        div_mensagem.innerHTML = "Preencha todos os campos!";
        finalizarAguardar();
        return false;
    }


    if (!emailVar.includes("@")) {
        div_mensagem.innerHTML = "E-mail inválido! Precisa conter @";
        finalizarAguardar();
        return false;
    }

    if (emailVar.length < 6) {
        div_mensagem.innerHTML = "E-mail muito curto!";
        finalizarAguardar();
        return false;
    }

    
    if (senhaVar.length < 6) {
        div_mensagem.innerHTML = "A senha precisa ter pelo menos 6 caracteres!";
        finalizarAguardar();
        return false;
    }

    

    fetch("/usuarios/autenticar", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            emailServer: emailVar,
            senhaServer: senhaVar,
        })
    }).then(function (resposta) {
        if (resposta.ok) {
            resposta.json().then(json => {
                sessionStorage.EMAIL_USUARIO = json.email;
                sessionStorage.NOME_USUARIO = json.nome;
                sessionStorage.ID_USUARIO = json.id;

                setTimeout(function () {
                    window.location = "./quiz.html";
                }, 1000);
            });
        } else {
            resposta.text().then(texto => {
                finalizarAguardar(texto);
            });
        }
    }).catch(function (erro) {
        console.log(erro);
    })

    return false;
}

function sumirMensagem() {
    div_mensagem.innerHTML = "";
}
</script>
