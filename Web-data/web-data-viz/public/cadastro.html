<script>


function cadastrar() {

    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;

     if (nomeVar == "" || emailVar == "" || senhaVar == "" || confirmacaoSenhaVar == "") {
        div_mensagem.innerHTML = "Preencha todos os campos!";
        return false;
    }

        if (nomeVar.length < 2) {
        div_mensagem.innerHTML = "Nome muito curto!";
        return false;
    }

    
    if (!emailVar.includes("@")) {
        div_mensagem.innerHTML = "E-mail inválido! Precisa conter @";
        return false;
    }

    if (emailVar.length < 6) {
        div_mensagem.innerHTML = "E-mail muito curto!";
        return false;
    }

    
    if (senhaVar.length < 6) {
        div_mensagem.innerHTML = "A senha precisa ter pelo menos 6 caracteres!";
        return false;
    }

    
    if (confirmacaoSenhaVar != senhaVar) {
        div_mensagem.innerHTML = "As senhas não coincidem!";
        return false;
    }

  
    fetch("/usuarios/cadastrar", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
        },
        body: JSON.stringify({
            nomeServer: nomeVar,
            emailServer: emailVar,
            senhaServer: senhaVar,
        }),
    })
    .then(function (resposta) {
        if (resposta.ok) {
            div_mensagem.innerHTML = "Cadastro realizado com sucesso! Redirecionando...";
            setTimeout(() => {
                window.location = "login.html";
            }, 2000);
        } else {
            throw "Houve um erro ao tentar realizar o cadastro!";
        }
    })
    .catch(function (resposta) {
        div_mensagem.innerHTML = "Erro ao cadastrar, tente novamente!";
        console.log(`#ERRO: ${resposta}`);
    });

    return false;
}

function sumirMensagem() {
    div_mensagem.innerHTML = "";
}
</script>
